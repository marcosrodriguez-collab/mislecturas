<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Libros Interactivos</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 25px;
            background-color: #2c3e50;
            color: white;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        header h1 { margin: 0; }

        .grid-libros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .tarjeta {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }

        .tarjeta h2 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            font-size: 1.2rem;
        }

        .btn-jugar {
            display: block;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-jugar:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 Mis Libros Interactivos</h1>
    </header>

    <main class="grid-libros" id="contenedor-libros">
        <p>Cargando lista...</p>
    </main>

    <script>
        async function cargarBiblioteca() {
            const contenedor = document.getElementById('contenedor-libros');
            
            try {
                const respuesta = await fetch('./libros.txt');
                if (!respuesta.ok) throw new Error("No se pudo encontrar el archivo libros.txt");
                
                const texto = await respuesta.text();
                // Obtener nombres de carpetas no vacíos
                const carpetas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                
                contenedor.innerHTML = ''; 

                carpetas.forEach(carpeta => {
                    // Extraer solo lo que está después del primer guión
                    let titulo = carpeta;
                    if (carpeta.includes('-')) {
                        titulo = carpeta.split('-').slice(1).join('-').trim();
                    }

                    const tarjeta = document.createElement('article');
                    tarjeta.className = 'tarjeta';
                    tarjeta.innerHTML = `
                        <h2>${titulo}</h2>
                        <a href="./${carpeta}/" class="btn-jugar">Leer Libro</a>
                    `;
                    contenedor.appendChild(tarjeta);
                });

            } catch (error) {
                contenedor.innerHTML = `<p style="color:red">Error: ${error.message}</p>`;
            }
        }

        cargarBiblioteca();
    </script>
</body>
</html>
