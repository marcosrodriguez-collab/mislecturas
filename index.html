<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Libros Interactivos</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 25px;
            background-color: #2c3e50;
            color: white;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        header h1 { margin: 0; }

        .grid-libros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .tarjeta {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tarjeta:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
        }

        .tarjeta h2 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            font-size: 1.15rem;
            min-height: 2.8em; /* Mantiene alineación si los títulos ocupan 2 líneas */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor adaptativo para las portadas */
        .contenedor-portada {
            width: 100%;
            height: 300px;
            background-color: #f8fafc;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e2e8f0;
        }

        .portada-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Adapta la portada completa sin recortarla */
            border-radius: 4px;
        }

        .btn-jugar {
            display: block;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-jugar:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 Mis Libros Interactivos</h1>
    </header>

    <main class="grid-libros" id="contenedor-libros">
        <p>Cargando lista de libros...</p>
    </main>

    <script>
        async function cargarBiblioteca() {
            const contenedor = document.getElementById('contenedor-libros');
            
            try {
                // Intenta cargar LIBROS.TXT o libros.txt
                let respuesta = await fetch('./LIBROS.TXT');
                if (!respuesta.ok) respuesta = await fetch('./libros.txt');
                
                if (!respuesta.ok) throw new Error("No se pudo encontrar el archivo LIBROS.TXT");
                
                const texto = await respuesta.text();
                // Obtener nombres de libros/carpetas limpios
                const carpetas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                
                contenedor.innerHTML = ''; 

                carpetas.forEach(carpeta => {
                    // Título visual (se elimina el prefijo de número si se desea)
                    let titulo = carpeta;
                    if (carpeta.includes('-')) {
                        titulo = carpeta.split('-').slice(1).join('-').trim();
                    }

                    // Construcción de la ruta exacta de la imagen JPG
                    const rutaImagen = `./${carpeta}.JPG`;

                    const tarjeta = document.createElement('article');
                    tarjeta.className = 'tarjeta';
                    tarjeta.innerHTML = `
                        <h2>${titulo}</h2>
                        <div class="contenedor-portada">
                            <img src="${rutaImagen}" 
                                 alt="Portada de ${titulo}" 
                                 class="portada-img"
                                 onerror="this.onerror=null; this.src='./${carpeta}.jpg'; this.onerror=function(){ this.parentNode.style.display='none'; }">
                        </div>
                        <a href="./${carpeta}/" class="btn-jugar">Leer Libro</a>
                    `;
                    contenedor.appendChild(tarjeta);
                });

            } catch (error) {
                contenedor.innerHTML = `<p style="color:red">Error: ${error.message}</p>`;
            }
        }

        cargarBiblioteca();
    </script>
</body>
</html>
