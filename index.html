<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Libros Interactivos</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 25px;
            background-color: #2c3e50;
            color: white;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        header h1 { margin: 0 0 10px 0; }
        header p { margin: 0; opacity: 0.9; font-size: 1.1rem; }

        .seccion-nivel {
            max-width: 1000px;
            margin: 0 auto 40px auto;
        }

        .titulo-seccion {
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 8px;
            margin-bottom: 20px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-libros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .tarjeta {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tarjeta:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
        }

        .tarjeta h2 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            font-size: 1.15rem;
            min-height: 2.8em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contenedor-portada {
            width: 100%;
            height: 300px;
            background-color: #f8fafc;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e2e8f0;
        }

        .portada-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        .btn-jugar {
            display: block;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-jugar:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 Biblioteca de Libros Interactivos</h1>
        <p>Selecciona tu nivel para comenzar la lectura</p>
    </header>

    <main id="contenedor-principal">
        <p style="text-align: center;">Cargando lista de libros...</p>
    </main>

    <script>
        async function cargarBiblioteca() {
            const contenedorPrincipal = document.getElementById('contenedor-principal');
            
            try {
                let respuesta = await fetch('./LIBROS.TXT');
                if (!respuesta.ok) respuesta = await fetch('./libros.txt');
                
                if (!respuesta.ok) throw new Error("No se pudo encontrar el archivo LIBROS.TXT");
                
                const texto = await respuesta.text();
                
                // Normalizar saltos de línea (\r de Windows)
                const textoLimpio = texto.replace(/\r/g, '');
                const lineas = textoLimpio.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                
                const libros34 = [];
                const libros56 = [];
                const librosOtros = [];

                lineas.forEach(linea => {
                    let codigoNivel = '';
                    let nombreCarpeta = linea;

                    // Extracción basada en prefijos #34# o #56#
                    if (linea.startsWith('#34#')) {
                        codigoNivel = '34';
                        nombreCarpeta = linea.replace('#34#', '').trim();
                    } else if (linea.startsWith('#56#')) {
                        codigoNivel = '56';
                        nombreCarpeta = linea.replace('#56#', '').trim();
                    }

                    // Limpieza del título visual (quita el prefijo "08-")
                    const tituloLimpio = nombreCarpeta.includes('-') 
                        ? nombreCarpeta.split('-').slice(1).join('-').trim() 
                        : nombreCarpeta;

                    const objetoLibro = {
                        carpeta: nombreCarpeta,
                        titulo: tituloLimpio
                    };

                    if (codigoNivel === '34') {
                        libros34.push(objetoLibro);
                    } else if (codigoNivel === '56') {
                        libros56.push(objetoLibro);
                    } else {
                        librosOtros.push(objetoLibro);
                    }
                });

                contenedorPrincipal.innerHTML = ''; 

                // 1. Sección 3.º y 4.º
                if (libros34.length > 0) {
                    renderizarSeccion('📘 Libros para 3.º y 4.º de Primaria', libros34);
                }

                // 2. Sección 5.º y 6.º
                if (libros56.length > 0) {
                    renderizarSeccion('📗 Libros para 5.º y 6.º de Primaria', libros56);
                }

                // 3. Sección General (libros no etiquetados)
                if (librosOtros.length > 0) {
                    renderizarSeccion('📙 Otras Lecturas', librosOtros);
                }

            } catch (error) {
                contenedorPrincipal.innerHTML = `<p style="color:red; text-align:center;">Error: ${error.message}</p>`;
            }
        }

        function renderizarSeccion(tituloSeccion, listaLibros) {
            const contenedorPrincipal = document.getElementById('contenedor-principal');
            
            const seccion = document.createElement('section');
            seccion.className = 'seccion-nivel';

            let htmlLibros = '';
            listaLibros.forEach(libro => {
                const rutaImagen = `./${libro.carpeta}.JPG`;

                htmlLibros += `
                    <article class="tarjeta">
                        <h2>${libro.titulo}</h2>
                        <div class="contenedor-portada">
                            <img src="${rutaImagen}" 
                                 alt="Portada de ${libro.titulo}" 
                                 class="portada-img"
                                 onerror="this.onerror=null; this.src='./${libro.carpeta}.jpg'; this.onerror=function(){ this.parentNode.style.display='none'; }">
                        </div>
                        <a href="./${libro.carpeta}/" class="btn-jugar">Leer Libro</a>
                    </article>
                `;
            });

            seccion.innerHTML = `
                <h2 class="titulo-seccion">${tituloSeccion}</h2>
                <div class="grid-libros">
                    ${htmlLibros}
                </div>
            `;

            contenedorPrincipal.appendChild(seccion);
        }

        cargarBiblioteca();
    </script>
</body>
</html>
