<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro Interactivo</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 20px auto;
            max-width: 650px;
            line-height: 1.6;
            background-color: #f4f7f6;
            color: #333;
        }

        #contenedor-libro {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* AJUSTE PARA LAS IMÁGENES: Muestra el JPG completo sin recortar */
        #contenedor-imagen {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background-color: #f8fafc;
            border-radius: 8px;
            overflow: hidden;
        }

        #imagen-pagina {
            max-width: 100%;
            height: auto;
            max-height: 500px; /* Límite razonable para que no ocupe toda la pantalla verticalmente */
            object-fit: contain; /* NUNCA corta la imagen, la escala completa */
            border-radius: 6px;
            display: block;
        }

        #texto-pagina {
            font-size: 1.1rem;
            margin-bottom: 25px;
            white-space: pre-line;
        }

        .opciones-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opcion {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: background-color 0.2s, transform 0.1s;
        }

        .opcion:hover {
            background-color: #34495e;
            transform: translateY(-2px);
        }

        .btn-preguntas {
            background-color: #27ae60 !important;
            font-weight: bold;
            text-align: center !important;
        }

        .btn-preguntas:hover {
            background-color: #219150 !important;
        }

        .btn-reinicio {
            background-color: #7f8c8d !important;
            text-align: center !important;
        }

        .btn-reinicio:hover {
            background-color: #95a5a6 !important;
        }

        .btn-atras {
            margin-top: 20px;
            background-color: transparent;
            color: #7f8c8d;
            border: 1px solid #bdc3c7;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-atras:hover {
            background-color: #ecf0f1;
            color: #2c3e50;
        }

        .resumen-recorrido {
            background-color: #eef2f5;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 6px 6px 0;
        }

        .resumen-recorrido h3 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1rem;
        }

        .resumen-recorrido p {
            margin-bottom: 0;
            font-weight: bold;
            color: #2980b9;
        }
    </style>
</head>
<body>

    <div id="contenedor-libro">
        <div id="contenedor-imagen">
            <img id="imagen-pagina" src="" alt="Ilustración de la página" style="display: none;">
        </div>
        <div id="texto-pagina">Cargando historia...</div>
        
        <div id="bloque-historial"></div>

        <div id="opciones" class="opciones-container"></div>
        <button id="btn-volver" class="btn-atras" style="display: none;">⬅ Volver a la página anterior</button>
    </div>

    <script>
        let historia = {};
        let paginaActual = 1;
        let historialPaginas = [];
        let paginasVisitadas = [1];

        const imagenEl = document.getElementById('imagen-pagina');
        const contenedorImagen = document.getElementById('contenedor-imagen');
        const textoEl = document.getElementById('texto-pagina');
        const opcionesDiv = document.getElementById('opciones');
        const btnVolver = document.getElementById('btn-volver');
        const bloqueHistorial = document.getElementById('bloque-historial');

        async function cargarHistoria() {
            try {
                let response = await fetch('./GEMHISTORIA.TXT');
                if (!response.ok) response = await fetch('./gemhistoria.txt');
                
                if (!response.ok) throw new Error("No se pudo cargar el archivo de historia");
                const texto = await response.text();
                parsearHistoria(texto);
                mostrarPagina(1);
            } catch (error) {
                textoEl.textContent = "Error al cargar la historia: " + error.message;
            }
        }

        function parsearHistoria(texto) {
            historia = {}; 
            const lineas = texto.replace(/\r\n/g, '\n').split('\n');
            let paginaNum = null;
            let contenido = [];

            lineas.forEach(linea => {
                const lineaLimpia = linea.trim();
                const matchPagina = lineaLimpia.match(/^(\d+)\s*#/);

                if (matchPagina) {
                    if (paginaNum !== null) {
                        procesarBloquePagina(paginaNum, contenido);
                    }
                    paginaNum = parseInt(matchPagina[1]);
                    contenido = [];
                } else if (lineaLimpia !== '') {
                    contenido.push(lineaLimpia);
                }
            });

            if (paginaNum !== null) {
                procesarBloquePagina(paginaNum, contenido);
            }
        }

        function procesarBloquePagina(numero, lineas) {
            let textoPagina = [];
            let opciones = [];

            lineas.forEach(linea => {
                if (linea.startsWith('#') && linea.includes(':')) {
                    const sinAlmohadilla = linea.substring(1);
                    const ultimaPosicionColon = sinAlmohadilla.lastIndexOf(':');
                    
                    const textoOpcion = sinAlmohadilla.substring(0, ultimaPosicionColon).trim();
                    const destinoPag = parseInt(sinAlmohadilla.substring(ultimaPosicionColon + 1).trim());

                    if (textoOpcion && !isNaN(destinoPag)) {
                        opciones.push({
                            texto: textoOpcion,
                            destino: destinoPag
                        });
                    }
                } else {
                    textoPagina.push(linea);
                }
            });

            historia[numero] = {
                texto: textoPagina.join('\n'),
                opciones: opciones
            };
        }

        function mostrarPagina(numero) {
            paginaActual = numero;
            const datosPagina = historia[numero];

            if (!paginasVisitadas.includes(numero)) {
                paginasVisitadas.push(numero);
            }

            if (!datosPagina) {
                textoEl.textContent = "Error: La página " + numero + " no existe en la historia.";
                opcionesDiv.innerHTML = '';
                bloqueHistorial.innerHTML = '';
                contenedorImagen.style.display = 'none';
                return;
            }

            // Cargar imagen de la página correspondiente
            const numFormateado = String(numero).padStart(3, '0');
            imagenEl.src = `./${numFormateado}.jpg`;
            imagenEl.style.display = 'block';
            contenedorImagen.style.display = 'flex';

            imagenEl.onerror = () => {
                // Si la imagen no existe, oculta el contenedor para que no deje espacio vacío
                imagenEl.style.display = 'none';
                contenedorImagen.style.display = 'none';
            };

            textoEl.textContent = datosPagina.texto;
            opcionesDiv.innerHTML = '';
            bloqueHistorial.innerHTML = '';

            if (datosPagina.opciones && datosPagina.opciones.length > 0) {
                datosPagina.opciones.forEach(opc => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.classList.add('opcion');
                    btn.textContent = opc.texto;
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        historialPaginas.push(paginaActual);
                        mostrarPagina(opc.destino);
                    });
                    opcionesDiv.appendChild(btn);
                });
            } else {
                mostrarResumenFinal();
                agregarOpcionesFinal();
            }

            if (historialPaginas.length > 0) {
                btnVolver.style.display = 'inline-block';
            } else {
                btnVolver.style.display = 'none';
            }

            window.scrollTo(0, 0);
        }

        function mostrarResumenFinal() {
            bloqueHistorial.innerHTML = `
                <div class="resumen-recorrido">
                    <h3>📌 Recorrido realizado:</h3>
                    <p>Páginas visitadas: ${paginasVisitadas.join(' ➔ ')}</p>
                </div>
            `;
        }

        function agregarOpcionesFinal() {
            const paginasCadena = paginasVisitadas.join(',');

            const btnPreguntas = document.createElement('button');
            btnPreguntas.type = 'button';
            btnPreguntas.classList.add('opcion', 'btn-preguntas');
            btnPreguntas.textContent = '📝 Realizar las preguntas de comprensión';
            btnPreguntas.onclick = function(e) {
                e.preventDefault();
                window.location.href = './questions.html?paginas=' + encodeURIComponent(paginasCadena);
            };
            opcionesDiv.appendChild(btnPreguntas);

            const btnReinicio = document.createElement('button');
            btnReinicio.type = 'button';
            btnReinicio.classList.add('opcion', 'btn-reinicio');
            btnReinicio.textContent = '🔄 Volver a leer la historia';
            btnReinicio.onclick = function(e) {
                e.preventDefault();
                paginaActual = 1;
                historialPaginas = [];
                paginasVisitadas = [1];
                mostrarPagina(1);
            };
            opcionesDiv.appendChild(btnReinicio);
        }

        btnVolver.addEventListener('click', (e) => {
            e.preventDefault();
            if (historialPaginas.length > 0) {
                const paginaAnterior = historialPaginas.pop();
                paginasVisitadas.pop();
                mostrarPagina(paginaAnterior);
            }
        });

        cargarHistoria();
    </script>
</body>
</html>
